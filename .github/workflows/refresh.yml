name: Refresh analytics

on:
  schedule:
    - cron: "17 10 * * *"   # every day around 6 AM Toronto time
  workflow_dispatch:         # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install google-analytics-data pandas xlrd openpyxl

      - name: Fetch website analytics
        env:
          GA4_CREDENTIALS: ${{ secrets.GA4_CREDENTIALS }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python fetch_website.py

      - name: Build LinkedIn data from exports
        run: python fetch_linkedin_export.py

      - name: Save new data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily analytics refresh"
          git push
